name: Build Newifi-D2 Passwall2
on:
  workflow_dispatch
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git libncurses-dev libssl-dev python3 python3-pip unzip wget zlib1g-dev

      - name: Clone ImmortalWrt
        run: git clone --depth 1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git

      - name: Generate .config inline
        working-directory: immortalwrt
        run: printf "CONFIG_TARGET_ramips=y\nCONFIG_TARGET_ramips_mt7621=y\nCONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y\nCONFIG_PACKAGE_luci=y\nCONFIG_LUCI_LANG_zh_Hans=y\nCONFIG_PACKAGE_luci-i18n-base-zh-cn=y\nCONFIG_PACKAGE_luci-app-passwall2=y\nCONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y\nCONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Xray=y\nCONFIG_CCACHE=y\n" > .config

      - name: Add passwall feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds add -f passwall2 https://github.com/xiaorouji/openwrt-passwall2.git^main
          ./scripts/feeds add -f passwall_pkgs https://github.com/xiaorouji/openwrt-passwall-packages.git^0eed799ea1ff165ab8df899e08038c3879f6ce95
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Defconfig
        working-directory: immortalwrt
        run: make defconfig

      - name: Download
        working-directory: immortalwrt
        run: make download -j$(nproc)

      - name: Compile
        working-directory: immortalwrt
        run: make -j$(nproc) || make -j1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Newifi3-ImmortalWrt-Passwall2
          retention-days: 7
          path: immortalwrt/bin/targets/ramips/mt7621/*.bin
