name: "Build Newifi-D2 Passwall2"

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          remove-dotnet: true
          remove-android: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ gawk gcc git libncurses-dev libssl-dev python3 rsync unzip wget ccache

      - name: Clone
        run: git clone --depth=1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git

      - name: Gen config
        working-directory: immortalwrt
        run: |
          printf 'CONFIG_TARGET_ramips=y\n' > .config
          printf 'CONFIG_TARGET_ramips_mt7621=y\n' >> .config
          printf 'CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y\n' >> .config
          printf 'CONFIG_PACKAGE_luci-app-passwall2=y\n' >> .config

      - name: Build
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make download -j$(nproc)
          make -j1 V=s
