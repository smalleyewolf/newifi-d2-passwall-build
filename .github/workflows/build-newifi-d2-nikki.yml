name: Build Newifi D2 OpenWrt with Nikki

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newifi-d2-nikki-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: "24.10.6"
  NIKKI_VERSION: "1.26.1"
  PROFILE: "d-team_newifi-d2"
  IMAGEBUILDER_SHA256: "8fee5728be3b30f8bc29dda87608284ff98217bac92f045a9a4626972fda225d"

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates curl jq make tar zstd

      - name: Download and verify OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail

          imagebuilder="openwrt-imagebuilder-${OPENWRT_VERSION}-ramips-mt7621.Linux-x86_64.tar.zst"
          base_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/ramips/mt7621"

          curl --fail --location --retry 5 --retry-delay 3 \
            --output "${imagebuilder}" "${base_url}/${imagebuilder}"

          echo "${IMAGEBUILDER_SHA256}  ${imagebuilder}" | sha256sum --check --strict
          tar --zstd --extract --file "${imagebuilder}"

          imagebuilder_dir="${imagebuilder%.tar.zst}"
          echo "IMAGEBUILDER_DIR=${imagebuilder_dir}" >> "${GITHUB_ENV}"

      - name: Download and verify Nikki packages
        shell: bash
        run: |
          set -euo pipefail

          asset_name="nikki_mipsel_24kc-openwrt-24.10.tar.gz"
          release_api="https://api.github.com/repos/nikkinikki-org/OpenWrt-nikki/releases/tags/v${NIKKI_VERSION}"

          curl --fail --location --retry 5 --retry-delay 3 \
            --output nikki-release.json "${release_api}"

          asset_url="$(jq --raw-output --arg name "${asset_name}" \
            '.assets[] | select(.name == $name) | .browser_download_url' nikki-release.json)"
          asset_digest="$(jq --raw-output --arg name "${asset_name}" \
            '.assets[] | select(.name == $name) | .digest // empty' nikki-release.json)"

          if [[ -z "${asset_url}" || "${asset_url}" == "null" ]]; then
            echo "Nikki asset not found: ${asset_name}" >&2
            exit 1
          fi

          curl --fail --location --retry 5 --retry-delay 3 \
            --output "${asset_name}" "${asset_url}"

          if [[ "${asset_digest}" == sha256:* ]]; then
            echo "${asset_digest#sha256:}  ${asset_name}" | sha256sum --check --strict
          else
            echo "GitHub did not return a SHA-256 digest for the Nikki asset." >&2
            exit 1
          fi

          tar --extract --gzip --file "${asset_name}" \
            --directory "${IMAGEBUILDER_DIR}/packages"

      - name: Add safe first-boot defaults
        shell: bash
        run: |
          set -euo pipefail

          defaults_dir="${IMAGEBUILDER_DIR}/files/etc/uci-defaults"
          mkdir -p "${defaults_dir}"

          cat > "${defaults_dir}/99-newifi-d2-nikki" <<'EOF'
          #!/bin/sh
          uci set system.@system[0].hostname='Newifi-D2-Nikki'
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci set luci.main.lang='zh_cn'
          uci commit system
          uci commit luci
          exit 0
          EOF

          chmod 0755 "${defaults_dir}/99-newifi-d2-nikki"

      - name: Build Newifi D2 firmware
        shell: bash
        run: |
          set -euo pipefail
          cd "${IMAGEBUILDER_DIR}"

          packages="luci luci-i18n-base-zh-cn \
          nikki luci-app-nikki luci-i18n-nikki-zh-cn mihomo-meta \
          ca-bundle curl yq ip-full \
          kmod-inet-diag kmod-nft-socket kmod-nft-tproxy kmod-tun kmod-dummy"

          make image \
            PROFILE="${PROFILE}" \
            PACKAGES="${packages}" \
            FILES="files" \
            EXTRA_IMAGE_NAME="nikki-${NIKKI_VERSION}"

      - name: Collect and inspect firmware
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p firmware
          find "${IMAGEBUILDER_DIR}/bin/targets/ramips/mt7621" \
            -maxdepth 1 -type f \
            \( -name '*newifi-d2*squashfs-sysupgrade.bin' \
               -o -name '*newifi-d2*.manifest' \
               -o -name 'profiles.json' \) \
            -exec cp --target-directory=firmware {} +

          sysupgrade_count="$(find firmware -maxdepth 1 -type f \
            -name '*newifi-d2*squashfs-sysupgrade.bin' | wc -l)"

          if [[ "${sysupgrade_count}" -ne 1 ]]; then
            echo "Expected exactly one Newifi D2 sysupgrade image, found ${sysupgrade_count}." >&2
            find firmware -maxdepth 1 -type f -print
            exit 1
          fi

          (cd firmware && sha256sum -- * > SHA256SUMS)
          ls -lh firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: Newifi-D2-OpenWrt-Nikki-${{ env.OPENWRT_VERSION }}
          path: firmware/
          if-no-files-found: error
          retention-days: 14
