name: "Newifi-D2 PassWall2"

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 420

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          move-to-var: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true

      - name: Show disk before
        run: df -h

      - name: Redirect apt cache to workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/apt-cache
          sudo chown -R runner:runner $GITHUB_WORKSPACE/apt-cache
          echo 'Dir::Cache::archives "'"$GITHUB_WORKSPACE/apt-cache"'";' | sudo tee /etc/apt/apt.conf.d/99cache

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ gawk gcc git libncurses-dev libssl-dev libelf-dev zlib1g-dev python3 python3-pip rsync unzip wget file ccache
          sudo apt-get clean

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git

      - name: Use China mirror
        working-directory: immortalwrt
        run: |
          sed -i 's|https://downloads.immortalwrt.org|https://mirrors.vsean.net/openwrt|g' scripts/download.pl include/version.mk || true

      - name: Gen config
        working-directory: immortalwrt
        run: |
          printf 'CONFIG_TARGET_ramips=y\n' > .config
          printf 'CONFIG_TARGET_ramips_mt7621=y\n' >> .config
          printf 'CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y\n' >> .config
          printf 'CONFIG_PACKAGE_luci=y\n' >> .config
          printf 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y\n' >> .config
          printf 'CONFIG_PACKAGE_luci-app-passwall2=y\n' >> .config
          printf 'CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Xray=y\n' >> .config
          printf 'CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y\n' >> .config

      - name: Add feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds add -f passwall2 https://github.com/xiaorouji/openwrt-passwall2.git
          ./scripts/feeds add -f passwall_pkgs https://github.com/xiaorouji/openwrt-passwall-packages.git
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Defconfig
        working-directory: immortalwrt
        run: |
          make defconfig
          grep -q "CONFIG_PACKAGE_luci-app-passwall2=y" .config || sed -i 's/# CONFIG_PACKAGE_luci-app-passwall2 is not set/CONFIG_PACKAGE_luci-app-passwall2=y/' .config
          make defconfig

      - name: Bake opkg feeds
        working-directory: immortalwrt
        run: |
          mkdir -p files/etc/opkg
          cat > files/etc/opkg/distfeeds.conf <<'EOF'
src/gz immortalwrt_core https://mirrors.vsean.net/openwrt/releases/24.10.6/targets/ramips/mt7621/packages
src/gz immortalwrt_base https://mirrors.vsean.net/openwrt/releases/24.10.6/packages/mipsel_24kc/base
src/gz immortalwrt_luci https://mirrors.vsean.net/openwrt/releases/24.10.6/packages/mipsel_24kc/luci
src/gz immortalwrt_packages https://mirrors.vsean.net/openwrt/releases/24.10.6/packages/mipsel_24kc/packages
src/gz immortalwrt_routing https://mirrors.vsean.net/openwrt/releases/24.10.6/packages/mipsel_24kc/routing
src/gz immortalwrt_telephony https://mirrors.vsean.net/openwrt/releases/24.10.6/packages/mipsel_24kc/telephony
EOF

      - name: Download
        working-directory: immortalwrt
        run: make download -j$(nproc)

      - name: Build
        working-directory: immortalwrt
        run: make -j$(nproc) V=s || make -j1 V=s

      - name: Show disk after
        run: df -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: Newifi-D2-ImmortalWrt24-Passwall2
          retention-days: 7
          path: immortalwrt/bin/targets/ramips/mt7621/*.bin